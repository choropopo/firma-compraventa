<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Firmador de Contrato</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #header {
    background: #1a1a2e; color: #fff;
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: sticky; top: 0; z-index: 10;
  }
  #header h1 { font-size: 14px; font-weight: 600; }
  #header span { font-size: 11px; opacity: 0.6; margin-left: 8px; }

  #toolbar {
    background: #fff; border-bottom: 1px solid #e0e0e0;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    position: sticky; top: 44px; z-index: 10;
  }
  .tool-group { display: flex; align-items: center; gap: 6px; }
  .divider { width: 1px; height: 26px; background: #ddd; }

  .toolbar-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; color: #333; cursor: pointer; font-size: 13px;
    min-height: 40px; -webkit-tap-highlight-color: transparent;
  }
  .toolbar-btn.primary { background: #185FA5; color: #fff; border-color: #185FA5; }
  .toolbar-btn.danger  { background: #fff0f0; color: #c0392b; border-color: #f0c0c0; }

  .color-swatch {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 2.5px solid transparent; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .color-swatch.active { border-color: #333; }

  label.lbl { font-size: 12px; color: #666; }
  input[type=range] { width: 70px; accent-color: #185FA5; }
  #stroke-val { font-size: 12px; color: #555; min-width: 18px; }

  #main {
    display: flex; justify-content: center;
    padding: 16px 0 40px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* El wrapper ocupa el ancho CSS real de la imagen */
  .canvas-wrap {
    position: relative;
    display: inline-block;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    border-radius: 4px;
    flex-shrink: 0;
  }
  /* Los canvas tienen el tamaño CSS (visual), pero internamente son 2x o 3x */
  #page-canvas,
  #sig-canvas {
    display: block;
    border-radius: 4px;
    /* width/height CSS se fijan por JS */
  }
  #sig-canvas {
    position: absolute; top: 0; left: 0;
    touch-action: none; cursor: crosshair;
  }

  #hint {
    text-align: center; font-size: 12px; color: #999;
    padding: 6px 10px;
  }

  /* Modal */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 999;
    align-items: center; justify-content: center; padding: 16px;
  }
  #modal-overlay.show { display: flex; }
  #modal-box {
    background: #fff; border-radius: 14px; padding: 18px;
    text-align: center; max-width: 95vw; width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  #modal-box p { font-size: 13px; color: #444; margin-bottom: 10px; }
  #modal-img {
    max-width: 100%; border-radius: 6px;
    border: 1px solid #ddd; margin-bottom: 14px; display: none;
  }
  #modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-btn {
    padding: 10px 18px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer; min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-btn.dl  { background: #185FA5; color: #fff; }
  .modal-btn.cls { background: #eee; color: #333; }
</style>
</head>
<body>

<div id="header">
  <h1>📄 Contrato Compraventa Vehículo</h1>
  <span>Firma digital</span>
</div>

<div id="toolbar">
  <div class="tool-group">
    <span class="lbl">Color:</span>
    <div class="color-swatch active" style="background:#1a1a1a" data-color="#1a1a1a" onclick="setColor(this)"></div>
    <div class="color-swatch" style="background:#185FA5" data-color="#185FA5" onclick="setColor(this)"></div>
    <div class="color-swatch" style="background:#A32D2D" data-color="#A32D2D" onclick="setColor(this)"></div>
  </div>
  <div class="divider"></div>
  <div class="tool-group">
    <span class="lbl">Grosor:</span>
    <input type="range" id="stroke-size" min="1" max="8" value="2" step="0.5">
    <span id="stroke-val">2</span>
  </div>
  <div class="divider"></div>
  <button class="toolbar-btn danger" onclick="clearSig()">🗑 Limpiar</button>
  <button class="toolbar-btn primary" onclick="guardarFirmado()">⬇ Guardar</button>
</div>

<div id="main">
  <div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="page-canvas"></canvas>
      <canvas id="sig-canvas"></canvas>
    </div>
    <div id="hint">✏️ Dibuja tu firma directamente sobre el documento</div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <p id="modal-msg">Mantén pulsada la imagen para guardarla, o pulsa Descargar.</p>
    <img id="modal-img" alt="Contrato firmado"/>
    <div id="modal-btns">
      <button class="modal-btn dl" onclick="descargarDesdeModal()">⬇ Descargar</button>
      <button class="modal-btn cls" onclick="cerrarModal()">✕ Cerrar</button>
    </div>
  </div>
</div>

const pageCanvas = document.getElementById('page-canvas');
const pageCtx    = pageCanvas.getContext('2d');
const sigCanvas  = document.getElementById('sig-canvas');
const sigCtx     = sigCanvas.getContext('2d');

let drawing     = false;
let strokeColor = '#1a1a1a';
let strokeWidth = 2;
let finalDataURL = '';

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

// devicePixelRatio: 1 en desktop, 2 en Retina/iOS, 3 en Android flagship
const DPR = window.devicePixelRatio || 1;

document.getElementById('stroke-size').addEventListener('input', function() {
  strokeWidth = parseFloat(this.value);
  document.getElementById('stroke-val').textContent = this.value;
});

function setColor(el) {
  document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  strokeColor = el.dataset.color;
}

function clearSig() {
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
}

// ── Cargar imagen con calidad real ──────────────────────────────
const img = new Image();
img.onload = function() {
  const imgW = img.naturalWidth;   // 993
  const imgH = img.naturalHeight;  // 1403

  // Ancho CSS disponible (pantalla sin scroll horizontal)
  const availW = window.innerWidth;

  // Ancho CSS al que se mostrará el canvas (puede ser menor que imgW en móvil)
  const cssW = Math.min(imgW, availW);
  const cssH = Math.round(imgH * (cssW / imgW));

  // Tamaño INTERNO del canvas = CSS × DPR  →  nitidez total
  const bufW = Math.round(cssW * DPR);
  const bufH = Math.round(cssH * DPR);

  // Aplicar tamaño interno
  pageCanvas.width  = bufW;
  pageCanvas.height = bufH;
  sigCanvas.width   = bufW;
  sigCanvas.height  = bufH;

  // Aplicar tamaño CSS visual
  pageCanvas.style.width  = cssW + 'px';
  pageCanvas.style.height = cssH + 'px';
  sigCanvas.style.width   = cssW + 'px';
  sigCanvas.style.height  = cssH + 'px';

  // Escalar el contexto para que 1 unidad CSS = DPR píxeles reales
  pageCtx.scale(DPR, DPR);
  sigCtx.scale(DPR, DPR);

  // Dibujar la imagen a tamaño CSS (el scale hace el resto)
  pageCtx.drawImage(img, 0, 0, cssW, cssH);
};
img.src = 'data:image/png;base64,' + IMG_BASE64;

// ── Posición ────────────────────────────────────────────────────
function getPos(e) {
  const rect = sigCanvas.getBoundingClientRect();
  // getBoundingClientRect da coordenadas CSS; el canvas internamente ya tiene scale
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: src.clientX - rect.left,
    y: src.clientY - rect.top
  };
}

// ── Mouse ───────────────────────────────────────────────────────
sigCanvas.addEventListener('mousedown', e => {
  drawing = true;
  const p = getPos(e);
  sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y);
});
sigCanvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const p = getPos(e);
  sigCtx.strokeStyle = strokeColor;
  sigCtx.lineWidth   = strokeWidth;
  sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
});
sigCanvas.addEventListener('mouseup',    () => drawing = false);
sigCanvas.addEventListener('mouseleave', () => drawing = false);

// ── Touch ───────────────────────────────────────────────────────
sigCanvas.addEventListener('touchstart', e => {
  e.preventDefault(); drawing = true;
  const p = getPos(e);
  sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y);
}, { passive: false });

sigCanvas.addEventListener('touchmove', e => {
  e.preventDefault(); if (!drawing) return;
  const p = getPos(e);
  sigCtx.strokeStyle = strokeColor;
  sigCtx.lineWidth   = strokeWidth;
  sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
}, { passive: false });

sigCanvas.addEventListener('touchend',    () => drawing = false);
sigCanvas.addEventListener('touchcancel', () => drawing = false);

// ── Guardar ─────────────────────────────────────────────────────
function guardarFirmado() {
  // Canvas final a resolución completa (DPR aplicado)
  const fc  = document.createElement('canvas');
  fc.width  = pageCanvas.width;   // ya incluye DPR
  fc.height = pageCanvas.height;
  const ctx = fc.getContext('2d');
  ctx.drawImage(pageCanvas, 0, 0);
  ctx.drawImage(sigCanvas,  0, 0);
  finalDataURL = fc.toDataURL('image/png');

  if (isIOS) {
    const mi = document.getElementById('modal-img');
    mi.src = finalDataURL;
    mi.style.display = 'block';
    document.getElementById('modal-msg').textContent =
      'Mantén pulsada la imagen para guardarla en tu galería, o pulsa Descargar.';
    document.getElementById('modal-overlay').classList.add('show');
  } else {
    const rnd = Math.floor(10000 + Math.random() * 90000);
    const a   = document.createElement('a');
    a.href = finalDataURL;
    a.download = 'contrato_firmado_' + rnd + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

function descargarDesdeModal() {
  if (!finalDataURL) return;
  const rnd = Math.floor(10000 + Math.random() * 90000);
  const a   = document.createElement('a');
  a.href = finalDataURL;
  a.download = 'contrato_firmado_' + rnd + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}
</script>
